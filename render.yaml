services:
  - type: web
    name: feeti-back
    runtime: node
    buildCommand: npm install && npm run build && cp -r src/generated dist/generated
    startCommand: npx prisma migrate deploy && node dist/index.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: ACCESS_TOKEN_SECRET
        sync: false
      - key: REFRESH_TOKEN_SECRET
        sync: false
      - key: FRONT_URL
        sync: false
      - key: FEETIPLAY_URL
        sync: false
      - key: FEETIPLAY_API_URL
        sync: false
      - key: FEETI_SYNC_SECRET
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: BCRYPT_SALT
        value: "10"
      - key: ACCESS_TOKEN_EXPIRY
        value: 1d
      - key: REFRESH_TOKEN_EXPIRY
        value: 7d
      - key: FIRESTORE_SYNC_ENABLED
        value: "true"
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false

      # ── Telnyx (SMS & WhatsApp) — valeurs à saisir dans le dashboard Render
      - key: TELNYX_API_KEY
        sync: false
      - key: TELNYX_MESSAGING_PROFILE_ID
        sync: false
      - key: TELNYX_SMS_FROM
        sync: false
      - key: TELNYX_WHATSAPP_FROM
        sync: false
      - key: TELNYX_DEFAULT_COUNTRY_CODE
        sync: false
